name: Build Aurora image

on:
  workflow_dispatch:

jobs:
  build:
    # Free native 64-bit ARM runner (public repositories): no emulation, much faster.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the project
        run: |
          ls -la
          test -f aurora-os.zip || { echo "aurora-os.zip is missing from the repository root"; exit 1; }
          unzip -q aurora-os.zip
          ls aurora-os

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Build image
        working-directory: aurora-os
        run: bash ./build.sh

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: aurora-image
          path: |
            aurora-os/out/*.img.xz
            aurora-os/out/*.info
          retention-days: 14
          compression-level: 0
